# Inspiration: https://gist.github.com/NickNaso/0d478f1481686d5bcc868cac06620a60
name: build-and-test
on: [push]
jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
          name: "Windows (MSVC)",
          artifact: "windows-msvc",
          os: windows-latest,
          build_type: "Release",
          cc: "cl",
          cxx: "cl",
          generator: "Visual Studio 18 2026"
        }
        - {
          name: "MacOS Clang/Xcode",
          artifact: "macos-clang-xcode",
          os: macos-latest,
          build_type: "Release",
          cc: "clang",
          cxx: "clang++",
          generator: "Xcode"
        }
        - {
          name: "MacOS GCC/Xcode",
          artifact: "macos-gcc-xcode",
          os: macos-latest,
          build_type: "Release",
          cc: "gcc",
          cxx: "g++",
          generator: "Xcode"
        }
        - {
          name: "MacOS Clang/Makefile",
          artifact: "macos-clang-makefile",
          os: macos-latest,
          build_type: "Release",
          cc: "clang",
          cxx: "clang++",
          generator: "Unix Makefiles"
        }
        - {
          name: "MacOS GCC/Makefile",
          artifact: "macos-gcc-makefile",
          os: macos-latest,
          build_type: "Release",
          cc: "gcc",
          cxx: "g++",
          generator: "Unix Makefiles"
        }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          mkdir build
          mkdir install
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -G "${{ matrix.config.generator }}" \
            --install-prefix "$(pwd)/install"
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.config.build_type }} --target install
      - name: Archive Install Directory
        uses: actions/upload-artifact@v4
        with:
          name: install-artifacts-${{ matrix.config.artifact }}
          path: |
            install
      - name: Test
        shell: bash
        run: ctest -C ${{ matrix.config.build_type }} --verbose --output-on-failure --test-dir build
